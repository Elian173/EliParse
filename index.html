<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boomi Profile Utilities</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Boomi Profile Utilities</h1>

    <div class="input-area">
        <label for="fileInput">Upload Boomi Profile XML File:</label>
        <input type="file" id="fileInput" accept=".xml"/>

        <label for="xmlInputArea">Or Paste XML Content:</label>
        <textarea id="xmlInputArea" placeholder="Paste Boomi Profile XML here..."></textarea>
    </div>

    <div>
        <label for="previewArea">Input Preview / Status:</label>
        <pre id="previewArea">Load or paste a Boomi EDI or XML Profile XML file...</pre>
         <div id="statusMessage" class="status-message"></div>
    </div>


    <div class="button-container">
        <div class="checkbox-container">
           <input type="checkbox" id="includeValidation" name="includeValidation" disabled>
           <label for="includeValidation">Include Validation Rules in XSD</label>
        </div>
        <button id="generateXsd" disabled>Generate XSD (EDI Only)</button>
        <button id="generateTags" disabled>Generate/Update TagLists (XML Only)</button>
        <button id="generateTagsAndRename" disabled>Generate Tags & Rename Elements (XML Only)</button>
    </div>


    <div id="generatedOutputContainer">
        <h3>Generated Output:</h3>
         <pre id="generatedContent"></pre>
         <button id="copyButton">Copy to Clipboard</button>
         <button id="downloadButton" style="display: none;">Download File</button>
         <span id="copyStatus" style="margin-left: 10px; font-style: italic;"></span>
    </div>

    <script src="profileProcessors.js"></script>
    <script src="main.js"></script>
</body>
</html>
